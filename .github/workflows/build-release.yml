name: build-release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter build apk --release --target-platform android-arm64
      - name: Package Android APK
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/hfs_flutter_android_arm64.apk
          sha256sum out/hfs_flutter_android_arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/hfs_flutter_android_arm64.apk
          retention-days: 14

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package Linux bundle
        run: |
          mkdir -p out
          cd build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/out/hfs_flutter_linux_x64.tar.gz" .
          sha256sum "$GITHUB_WORKSPACE/out/hfs_flutter_linux_x64.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/hfs_flutter_linux_x64.tar.gz
          retention-days: 14

  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows bundle & Inno Setup Installer (.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $rel = "build/windows/x64/runner/Release"
          if (!(Test-Path "$rel/hfs_flutter.exe")) { Write-Error "hfs_flutter.exe missing"; exit 1 }
          Compress-Archive -Path "$rel/*" -DestinationPath "out/hfs_flutter_windows_x64.zip" -Force

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "windows/installer.iss"
          if (!(Test-Path "out/hfs_flutter_windows_x64_setup.exe")) {
            Write-Error "Inno Setup installer hfs_flutter_windows_x64_setup.exe was not generated"
            exit 1
          }
          Get-FileHash "out/hfs_flutter_windows_x64_setup.exe" -Algorithm SHA256 | Format-List
          Get-FileHash "out/hfs_flutter_windows_x64.zip" -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            out/hfs_flutter_windows_x64_setup.exe
            out/hfs_flutter_windows_x64.zip
          retention-days: 14

  release:
    needs: [ android, linux, windows ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten & compute SHA256SUMS
        run: |
          mkdir -p release
          find dist -type f \( -name '*.apk' -o -name '*.tar.gz' -o -name '*.zip' -o -name '*.exe' \) -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v2.1.0' }}
          name: 好分数原生工作台 ${{ github.ref_type == 'tag' && github.ref_name || 'v2.1.0' }}
          body: |
            好分数原生 Flutter 客户端（手机 + 电脑全端适配，100% 直连好分数官方后端 `hfs-be.yunxiao.com` / `yj-oss.yunxiao.com`）。
            - **Windows 电脑端安装程序 (`Inno Setup x64`)**: `hfs_flutter_windows_x64_setup.exe`（双击直接安装并创建桌面快捷方式）
            - **Windows 电脑端便携压缩包 (`x64`)**: `hfs_flutter_windows_x64.zip`
            - **Android 手机端 (`arm64`)**: `hfs_flutter_android_arm64.apk`
            - **Linux 电脑端 (`x64`)**: `hfs_flutter_linux_x64.tar.gz`
          files: |
            release/hfs_flutter_windows_x64_setup.exe
            release/hfs_flutter_windows_x64.zip
            release/hfs_flutter_android_arm64.apk
            release/hfs_flutter_linux_x64.tar.gz
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
