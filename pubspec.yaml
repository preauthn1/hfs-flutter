name: hfs_flutter
description: "Haofenshu Native Flutter Client (Direct HFS Upstream Only, Mobile + Desktop)"
publish_to: 'none'
version: 2.3.1+6

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: 2.5.3
  crypto: ^3.0.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_logo.png
    - assets/images/hero_auth_banner.png
    - assets/images/empty_inspector.png
    - assets/images/empty_wrong_book.png
    - assets/images/student_medallion.png
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-500.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC-700.ttf
          weight: 700
